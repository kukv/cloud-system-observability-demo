---
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: "15m"

compactor:
  compaction:
    block_retention: "168h"

metrics_generator:
  registry:
    external_labels:
      source: "tempo"
      cluster: "observability-demo"
  storage:
    path: "/tmp/tempo/generator/wal"
    remote_write:
      - url: "http://prometheus:9090/api/v1/write"
        send_exemplars: true
  traces_storage:
    path: "/tmp/tempo/generator/traces"

storage:
  trace:
    backend: "local"
    wal:
      path: "/tmp/tempo/wal"
    local:
      path: "/tmp/tempo/blocks"

overrides:
  defaults:
    metrics_generator:
      processors:
        - "service-graphs"
        - "span-metrics"
        - "local-blocks"
