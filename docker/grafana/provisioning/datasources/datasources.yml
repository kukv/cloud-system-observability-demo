---
apiVersion: 1

datasources:
  - name: "Prometheus"
    uid: "prometheus"
    type: "prometheus"
    access: "proxy"
    url: "http://prometheus:9090"
    isDefault: true
    editable: true
    jsonData:
      httpMethod: "POST"
      timeInterval: "15s"
      queryTimeout: "60s"
      exemplarTraceIdDestinations:
        - name: "trace_id"
          datasourceUid: "tempo"

  - name: "Loki"
    uid: "loki"
    type: "loki"
    access: "proxy"
    url: "http://loki:3100"
    editable: true
    jsonData:
      maxLines: 1000
      timeout: "60s"
      derivedFields:
        - datasourceUid: "tempo"
          matcherRegex: "trace_id=(\\w+)"
          name: "TraceID"
          url: "$${__value.raw}"
        # トレースIDの別パターンにも対応
        - datasourceUid: "tempo"
          matcherRegex: "traceId[\":\\s]+(\\w+)"
          name: "TraceID (JSON)"
          url: "$${__value.raw}"

  - name: "Tempo"
    uid: "tempo"
    type: "tempo"
    access: "proxy"
    url: "http://tempo:3200"
    editable: true
    jsonData:
      httpMethod: "GET"
      tracesToLogs:
        datasourceUid: "loki"
        tags:
          - "job"
          - "instance"
          - "pod"
          - "namespace"
        mappedTags:
          - key: "service.name"
            value: "service"
        mapTagNamesEnabled: false
        spanStartTimeShift: "5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: "prometheus"
        tags:
          - key: "service.name"
            value: "service"
          - key: "job"
        queries:
          - name: "Request Rate"
            query: "sum(rate(tempo_spanmetrics_calls_total{$$__tags}[$__rate_interval]))"
          - name: "Error Rate"
            query: "sum(rate(tempo_spanmetrics_calls_total{$$__tags,status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval]))"
          - name: "Duration p95"
            query: "histogram_quantile(0.95, sum(rate(tempo_spanmetrics_latency_bucket{$$__tags}[$__rate_interval])) by (le))"
      serviceMap:
        datasourceUid: "prometheus"
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: "loki"
